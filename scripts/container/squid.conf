# Default-deny forward proxy for the agent container.
#
# Two kinds of allowed traffic:
#   - allowlisted domains: an HTTPS tunnel (CONNECT) is relayed unread. The proxy sees the
#     hostname and nothing else.
#   - inspected domains (/run/squid/inspect-domains.txt, chosen by PROXY_INSPECT): the proxy
#     terminates TLS with its own CA and applies method and path rules, so GitHub can be
#     allowed for reads (clone, fetch, GET) and refused for writes (push, POST, PUT, DELETE).
# Everything else, including plain HTTP, is refused.

http_port 3128 ssl-bump generate-host-certificates=on dynamic_cert_mem_cache_size=4MB \
  tls-cert=/var/lib/agent-proxy/ca.pem tls-key=/var/lib/agent-proxy/ca.key
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/agent-proxy/ssl_db -M 4MB
sslcrtd_children 3 startup=1 idle=1
# Runs as the unprivileged proxy user, so the pid file goes in its own directory.
pid_filename /run/squid/squid.pid

# Squid resolves names itself, using the servers in this file. agent-run.sh writes it from
# the host's upstream resolvers. The container's own resolv.conf is not usable: on many hosts
# it points at the 127.0.0.53 stub, which a container cannot reach.
include /etc/squid/dns.conf

acl SSL_ports port 443
acl CONNECT method CONNECT
# One domain per line. A leading dot matches subdomains as well.
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl inspect_domains dstdomain "/run/squid/inspect-domains.txt"
# The name the client puts in the TLS handshake (SNI). A tunnel whose SNI is not on either list
# is cut, so a client cannot open a tunnel to an allowed host and speak to another (domain fronting).
acl allowed_sni  ssl::server_name "/etc/squid/allowed-domains.txt"
acl inspect_sni  ssl::server_name "/run/squid/inspect-domains.txt"
acl step1 at_step SslBump1
# Rules for inspected domains: reads, plus the one POST that git fetch and clone need.
acl read_methods method GET HEAD OPTIONS
acl POST method POST
# (url_regex sees the whole URL including the query string; urlpath_regex does not see the query.)
acl git_fetch url_regex ^https://[^/]+/[^?]+/git-upload-pack(\?.*)?$
# The first request of a push is a GET asking for the receive-pack service. Refusing it too
# makes `git push` fail at the proxy at once, whatever credentials the client has.
acl git_push url_regex -i git-receive-pack

# Audit mode adds its allow-all rules here; in enforce mode this file is empty.
include /run/squid/mode.conf

# TLS handling, decided after peeking at the ClientHello.
ssl_bump peek step1
ssl_bump bump inspect_sni
ssl_bump terminate !allowed_sni
ssl_bump splice all

# Tunnels: HTTPS only, and only to listed domains. A refused tunnel gets a connection reset,
# not an error page: on a TLS-inspecting port Squid would otherwise answer the CONNECT with 200
# and serve the error over a certificate of its own, which confuses clients that do not trust it.
acl refused_tunnel src all
deny_info TCP_RESET refused_tunnel
http_access deny CONNECT !SSL_ports refused_tunnel
http_access allow CONNECT allowed_domains
http_access allow CONNECT inspect_domains
http_access deny CONNECT refused_tunnel
# Requests inside an inspected tunnel (the only non-CONNECT requests that can get here).
http_access deny inspect_domains git_push
http_access allow inspect_domains read_methods
http_access allow inspect_domains POST git_fetch
http_access deny all

# Stop promptly on `podman rm -f` instead of waiting 30 seconds for idle clients.
shutdown_lifetime 1 seconds

# No caching: this is a filter, not a cache.
cache deny all
# Do not add headers that identify the internal client.
forwarded_for delete
via off
# One line per tunnel or inspected request: time, client, result/status, size, method, URL.
# Review with: egress-report.sh, or podman exec agent-proxy tail -f /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log squid
# Keep query strings in the log: for git they say which service was asked for.
strip_query_terms off
