# Default-deny forward proxy for the agent container.
http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT
# One domain per line. A leading dot matches subdomains as well.
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

# Squid resolves names itself, using the servers in this file. agent-run.sh writes it from
# the host's upstream resolvers. The container's own resolv.conf is not usable: on many hosts
# it points at the 127.0.0.53 stub, which a container cannot reach.
include /etc/squid/dns.conf

# HTTPS only, and only to allowlisted domains.
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT
http_access allow allowed_domains
http_access deny all

# Stop promptly on `podman rm -f` instead of waiting 30 seconds for idle clients.
shutdown_lifetime 1 seconds

# No caching: this is a filter, not a cache.
cache deny all
# Do not add headers that identify the internal client.
forwarded_for delete
via off
# Review with: podman exec agent-proxy tail -f /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log squid
